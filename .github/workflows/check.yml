name: check

# release.yml은 main push에서 이 workflow가 성공한 커밋만 게시하고 검사를 다시 하지 않습니다.
# release.yml이 workflow_run으로 이 workflow의 이름(check)을 기다리므로, 이름을 바꾸면 release.yml도 함께 바꿉니다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pnpm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm은 package.json의 packageManager에 적힌 버전으로 설치합니다.
      # setup-node의 pnpm store cache가 pnpm을 실행하므로 pnpm을 먼저 설치합니다.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 컴포넌트 테스트(pnpm run test:components)가 실제 chromium에서 실행됩니다.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check

  # 배포 패키지가 지원 하한인 Node 22에서 설치되고 실행되는지 확인합니다. bd는 설치하지 않으므로 서버는 띄우지 않습니다.
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack
        working-directory: packages/app
        run: |
          pnpm run pack:local
          mv seungyeop-lee-beads-desk-*.tgz "$RUNNER_TEMP/beads-desk.tgz"
      # windows-smoke job이 이 tarball을 설치합니다. act의 artifact server는 upload-artifact v7의 요청을 받지 못하므로 act에서는 건너뜁니다.
      - if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: beads-desk-package
          path: ${{ runner.temp }}/beads-desk.tgz
          if-no-files-found: error
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install with npm on Node 22
        run: |
          node --version
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/beads-desk.tgz"
      - name: Smoke test
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/runtime
        run: |
          bd_desk="$RUNNER_TEMP/prefix/bin/bd-desk"
          package_root="$RUNNER_TEMP/prefix/lib/node_modules/@seungyeop-lee/beads-desk"

          # 실행 파일이 import하는 파일이 빠졌으면 여기서 실패합니다.
          "$bd_desk" --help

          # 서버를 띄울 때 실행 파일과 같은 방식으로 찾는 next가 의존성으로 설치됐는지 확인합니다.
          node -e 'require("node:module").createRequire(process.argv[1]).resolve("next/dist/bin/next")' "$package_root/bin/bd-desk.js"

          # 모듈을 찾지 못한 오류도 종료 코드 1이므로, 실행 중인 서버가 없을 때의 종료 코드 2로 명령까지 실행됐는지 확인합니다.
          status=0
          "$bd_desk" stop || status=$?
          test "$status" -eq 2

          # workspace가 없는 디렉터리에서는 서버를 띄우지 않고 종료 코드 1로 끝나야 합니다.
          empty_dir="$(mktemp -d)"
          status=0
          (cd "$empty_dir" && "$bd_desk" start) || status=$?
          test "$status" -eq 1
          test ! -e "$XDG_RUNTIME_DIR/beads-desk/server.json"

  # 배포 패키지를 Windows에 설치해 bd-desk로 서버를 띄우고 다시 띄우고 끄는지 확인합니다.
  # 게시본처럼 ubuntu에서 만든 tarball을 설치하고, Windows에서는 저장소를 설치하거나 빌드하지 않습니다.
  # act는 Windows job을 실행하지 못하므로 PR의 GitHub Actions 실행 결과로 확인합니다.
  windows-smoke:
    needs: package-smoke
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # bd 설치 방법마다 PATH에 놓이는 실행 파일이 다릅니다. npm은 bd.exe를 감싸는 bd.cmd shim을, 설치 스크립트는 bd.exe를 둡니다.
        bd-install: [npm, install-script]
    defaults:
      run:
        # pwsh는 native 명령이 실패해도 다음 줄을 실행하므로, 실패한 명령에서 단계를 멈추게 합니다.
        shell: pwsh -NoProfile -Command "$PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: beads-desk-package
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # bd-desk와 npm으로 설치한 bd의 shim이 놓이는 npm 전역 디렉터리를 사용자 환경처럼 PATH에 둡니다.
      - name: Add the npm global directory to PATH
        run: Add-Content $env:GITHUB_PATH (npm prefix -g)

      # 서버가 bd.cmd shim에서 bd.exe를 찾아 실행하는지 확인하려면 PATH에 다른 bd.exe가 없어야 합니다.
      - name: Install bd with npm
        if: matrix.bd-install == 'npm'
        run: |
          # @beads/bd의 postinstall은 CI 환경 변수가 있으면 bd.exe를 내려받지 않으므로, 사용자 환경처럼 CI를 지우고 설치합니다.
          Remove-Item Env:CI
          npm install -g @beads/bd@1.3.1
          if (Get-Command bd.exe -ErrorAction SilentlyContinue) { throw "bd.exe is on PATH, so the bd.cmd shim is not exercised." }
      # 설치 스크립트는 version을 고를 수 없어 최신 release를 설치하고, 설치 디렉터리를 PATH에 넣지 않습니다.
      - name: Install bd with the install script
        if: matrix.bd-install == 'install-script'
        run: |
          irm https://raw.githubusercontent.com/gastownhall/beads/main/install.ps1 | iex
          Add-Content $env:GITHUB_PATH (Join-Path $env:LOCALAPPDATA "Programs\bd")

      - name: Install beads-desk with npm on Node 22
        run: |
          node --version
          npm install -g (Join-Path $env:RUNNER_TEMP beads-desk.tgz)

      # embedded mode는 server mode와 달리 Dolt를 따로 설치하고 서버를 띄웠다 끄지 않아도 되므로 이 mode로만 확인합니다.
      - name: Create a bd workspace in embedded mode
        run: |
          $workspace = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP desk-smoke)
          Set-Location $workspace
          bd version
          git init --quiet
          bd init --prefix smoke --quiet --non-interactive --skip-agents
          $dolt = bd dolt show --json | Out-String | ConvertFrom-Json
          $dolt | ConvertTo-Json
          if ($dolt.embedded -ne $true) { throw "bd init did not create an embedded-mode database." }
          Add-Content $env:GITHUB_ENV "WORKSPACE=$($workspace.FullName)"

      - name: Start the server
        run: |
          Set-Location $env:WORKSPACE
          $output = bd-desk start
          $output
          $url = ($output | Select-String -CaseSensitive '^URL: (.+)$').Matches[0].Groups[1].Value
          if ($url -cnotmatch '^http://127\.0\.0\.1:\d+/w/desk-smoke$') { throw "Unexpected workspace URL: $url" }
          $server = $url -creplace '/w/desk-smoke$', ''
          $health = Invoke-RestMethod "$server/api/health"
          $health | ConvertTo-Json -Depth 5
          if (-not $health.runtime.bdVersion) { throw "The server could not run bd." }
          if ($health.runtime.workspaces -cnotcontains $env:WORKSPACE) { throw "The workspace is not registered: $env:WORKSPACE" }
          Invoke-WebRequest $url | Out-Null
          Add-Content $env:GITHUB_ENV "DESK_URL=$url", "DESK_SERVER=$server"

      - name: Restart the server
        run: |
          Set-Location $env:WORKSPACE
          $output = bd-desk restart
          $output
          if ($output -cnotcontains "URL: $env:DESK_URL") { throw "restart did not print the same workspace URL: $env:DESK_URL" }
          Invoke-WebRequest $env:DESK_URL | Out-Null

      - name: Stop the server
        run: |
          bd-desk stop
          $responding = $true
          try { Invoke-WebRequest "$env:DESK_SERVER/api/health" -TimeoutSec 5 | Out-Null } catch { $responding = $false }
          if ($responding) { throw "The server still responds after bd-desk stop." }

      # bd-desk는 서버 로그를 OS 임시 디렉터리 아래 beads-desk\server.log에 남깁니다.
      - name: Print the server log
        if: always()
        run: |
          $log = Join-Path (node -p "require('os').tmpdir()") beads-desk\server.log
          if (Test-Path $log) { Get-Content $log }
