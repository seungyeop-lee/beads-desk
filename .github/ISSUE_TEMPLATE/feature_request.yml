name: Feature request
description: Suggest a new feature or a change to beads-desk.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        beads-desk runs the `bd` CLI and cannot change how `bd` stores or reports issues. If your request needs a change in `bd` itself, open it in [Beads](https://github.com/gastownhall/beads) instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard with beads-desk today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Other ways to solve the problem, including workarounds you use now.
