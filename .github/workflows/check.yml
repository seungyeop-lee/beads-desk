name: check

# release.yml은 main push에서 이 workflow가 성공한 커밋만 게시하고 검사를 다시 하지 않습니다.
# release.yml이 workflow_run으로 이 workflow의 이름(check)을 기다리므로, 이름을 바꾸면 release.yml도 함께 바꿉니다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pnpm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm은 package.json의 packageManager에 적힌 버전으로 설치합니다.
      # setup-node의 pnpm store cache가 pnpm을 실행하므로 pnpm을 먼저 설치합니다.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 컴포넌트 테스트(pnpm run test:components)가 실제 chromium에서 실행됩니다.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check

  # 배포 패키지가 지원 하한인 Node 22에서 설치되고 실행되는지 확인합니다. bd는 설치하지 않으므로 서버는 띄우지 않습니다.
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack
        working-directory: packages/app
        run: |
          pnpm run pack:local
          mv seungyeop-lee-beads-desk-*.tgz "$RUNNER_TEMP/beads-desk.tgz"
      # windows-smoke job이 이 tarball을 설치합니다. act의 artifact server는 upload-artifact v7의 요청을 받지 못하므로 act에서는 건너뜁니다.
      - if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: beads-desk-package
          path: ${{ runner.temp }}/beads-desk.tgz
          if-no-files-found: error
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install with npm on Node 22
        run: |
          node --version
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/beads-desk.tgz"
      - name: Smoke test
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/runtime
        run: |
          bd_desk="$RUNNER_TEMP/prefix/bin/bd-desk"
          package_root="$RUNNER_TEMP/prefix/lib/node_modules/@seungyeop-lee/beads-desk"

          # 실행 파일이 import하는 파일이 빠졌으면 여기서 실패합니다.
          "$bd_desk" --help

          # 서버를 띄울 때 실행 파일과 같은 방식으로 찾는 next가 의존성으로 설치됐는지 확인합니다.
          node -e 'require("node:module").createRequire(process.argv[1]).resolve("next/dist/bin/next")' "$package_root/bin/bd-desk.js"

          # 모듈을 찾지 못한 오류도 종료 코드 1이므로, 실행 중인 서버가 없을 때의 종료 코드 2로 명령까지 실행됐는지 확인합니다.
          status=0
          "$bd_desk" stop || status=$?
          test "$status" -eq 2

          # workspace가 없는 디렉터리에서는 서버를 띄우지 않고 종료 코드 1로 끝나야 합니다.
          empty_dir="$(mktemp -d)"
          status=0
          (cd "$empty_dir" && "$bd_desk" start) || status=$?
          test "$status" -eq 1
          test ! -e "$XDG_RUNTIME_DIR/beads-desk/server.json"

  # 배포 패키지를 Windows에 설치해 bd-desk로 서버를 띄우고 다시 띄우고 끄는지 확인합니다.
  # 게시본처럼 ubuntu에서 만든 tarball을 설치하고, Windows에서는 저장소를 설치하거나 빌드하지 않습니다.
  # act는 Windows job을 실행하지 못하므로 PR의 GitHub Actions 실행 결과로 확인합니다.
  windows-smoke:
    needs: package-smoke
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # bd 설치 방법마다 PATH에 놓이는 실행 파일이 다릅니다. npm은 bd.exe를 감싸는 bd.cmd shim을, 설치 스크립트는 bd.exe를 둡니다.
        bd-install: [npm, install-script]
    defaults:
      run:
        # pwsh는 native 명령이 실패해도 다음 줄을 실행하므로, 실패한 명령에서 단계를 멈추게 합니다.
        shell: pwsh -NoProfile -Command "$PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: beads-desk-package
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # bd-desk와 npm으로 설치한 bd의 shim이 놓이는 npm 전역 디렉터리를 사용자 환경처럼 PATH에 둡니다.
      - name: Add the npm global directory to PATH
        run: Add-Content $env:GITHUB_PATH (npm prefix -g)

      # 서버가 bd.cmd shim에서 bd.exe를 찾아 실행하는지 확인하려면 PATH에 다른 bd.exe가 없어야 합니다.
      - name: Install bd with npm
        if: matrix.bd-install == 'npm'
        run: |
          # @beads/bd의 postinstall은 CI 환경 변수가 있으면 bd.exe를 내려받지 않으므로, 사용자 환경처럼 CI를 지우고 설치합니다.
          Remove-Item Env:CI
          npm install -g @beads/bd@1.3.1
          if (Get-Command bd.exe -ErrorAction SilentlyContinue) { throw "bd.exe is on PATH, so the bd.cmd shim is not exercised." }
      # 설치 스크립트는 version을 고를 수 없어 최신 release를 설치하고, 설치 디렉터리를 PATH에 넣지 않습니다.
      - name: Install bd with the install script
        if: matrix.bd-install == 'install-script'
        run: |
          irm https://raw.githubusercontent.com/gastownhall/beads/main/install.ps1 | iex
          Add-Content $env:GITHUB_PATH (Join-Path $env:LOCALAPPDATA "Programs\bd")

      - name: Install beads-desk with npm on Node 22
        run: |
          node --version
          npm install -g (Join-Path $env:RUNNER_TEMP beads-desk.tgz)

      # embedded mode는 server mode와 달리 Dolt를 따로 설치하고 서버를 띄웠다 끄지 않아도 되므로 이 mode로만 확인합니다.
      - name: Create a bd workspace in embedded mode
        run: |
          $workspace = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP desk-smoke)
          Set-Location $workspace
          bd version
          git init --quiet
          bd init --prefix smoke --quiet --non-interactive --skip-agents
          $dolt = bd dolt show --json | Out-String | ConvertFrom-Json
          $dolt | ConvertTo-Json
          if ($dolt.embedded -ne $true) { throw "bd init did not create an embedded-mode database." }
          Add-Content $env:GITHUB_ENV "WORKSPACE=$($workspace.FullName)"

      - name: Start the server
        run: |
          Set-Location $env:WORKSPACE
          $output = bd-desk start
          $output
          $url = ($output | Select-String -CaseSensitive '^URL: (.+)$').Matches[0].Groups[1].Value
          if ($url -cnotmatch '^http://127\.0\.0\.1:\d+/w/desk-smoke$') { throw "Unexpected workspace URL: $url" }
          $server = $url -creplace '/w/desk-smoke$', ''
          $health = Invoke-RestMethod "$server/api/health"
          $health | ConvertTo-Json -Depth 5
          if (-not $health.runtime.bdVersion) { throw "The server could not run bd." }
          if ($health.runtime.workspaces -cnotcontains $env:WORKSPACE) { throw "The workspace is not registered: $env:WORKSPACE" }
          Invoke-WebRequest $url | Out-Null
          Add-Content $env:GITHUB_ENV "DESK_URL=$url", "DESK_SERVER=$server"

      - name: Restart the server
        run: |
          Set-Location $env:WORKSPACE
          $output = bd-desk restart
          $output
          if ($output -cnotcontains "URL: $env:DESK_URL") { throw "restart did not print the same workspace URL: $env:DESK_URL" }
          Invoke-WebRequest $env:DESK_URL | Out-Null

      # 서버는 C 드라이브의 npm 전역 디렉터리에서 실행되므로, 기본 허용 루트에 /tmp가 남아 있으면 C:\tmp의 파일이 200이 됩니다.
      - name: Request local files
        run: |
          $inside = Join-Path $env:WORKSPACE local-file.md
          Set-Content $inside inside
          New-Item -ItemType Directory -Force C:\tmp | Out-Null
          Set-Content C:\tmp\local-file.md outside
          $expected = [ordered]@{ $inside = 200; 'C:\Windows\win.ini' = 403; 'C:\tmp\local-file.md' = 403 }
          foreach ($path in $expected.Keys) {
            # 화면의 localFileUrl과 같은 query로 요청합니다.
            $query = "path=$([uri]::EscapeDataString($path))&workspace=desk-smoke"
            $status = (Invoke-WebRequest "$env:DESK_SERVER/api/local-files?$query" -SkipHttpErrorCheck).StatusCode
            "$path -> $status"
            if ($status -ne $expected[$path]) { throw "Expected $($expected[$path]) for $path, got $status." }
          }

      # Windows 파일 시스템은 대소문자를 구분하지 않으므로, 대소문자만 다른 경로로 시작해도 workspace는 하나로 등록돼야 합니다.
      # 셸은 현재 디렉터리의 대소문자를 바꿀 수 있어서, 입력한 경로를 그대로 cwd로 주도록 node로 bd-desk.js를 실행합니다.
      - name: Start from paths that differ only in case
        run: |
          $bdDesk = Join-Path (npm root -g) '@seungyeop-lee\beads-desk\bin\bd-desk.js'
          $script = Join-Path $env:RUNNER_TEMP run-bd-desk.mjs
          Set-Content $script @'
          import { spawnSync } from "node:child_process";
          import { realpathSync } from "node:fs";
          const [bdDesk, command, cwd] = process.argv.slice(2);
          const git = spawnSync("git", ["rev-parse", "--show-toplevel"], { cwd, encoding: "utf8" });
          console.log(`cwd: ${cwd}`);
          console.log(`realpathSync: ${realpathSync(cwd)}`);
          console.log(`realpathSync.native: ${realpathSync.native(cwd)}`);
          console.log(`git rev-parse --show-toplevel: ${git.stdout.trim()}`);
          const result = spawnSync(process.execPath, [bdDesk, command], { cwd, encoding: "utf8" });
          console.log(`bd-desk ${command} exited with ${result.status}`);
          console.log(result.stdout + result.stderr);
          process.exit(result.status ?? 1);
          '@
          function Invoke-BdDesk($command, $cwd) {
            # 종료 코드 1을 기대하는 실행도 있으므로, 이 함수 안에서는 실패한 node가 단계를 멈추지 않게 합니다.
            $PSNativeCommandUseErrorActionPreference = $false
            Push-Location -LiteralPath $cwd
            "process.cwd() after Set-Location: $(node -p 'process.cwd()')" | Out-Host
            Pop-Location
            $output = node $script $bdDesk $command $cwd
            $output | Out-Host
            $status = $LASTEXITCODE
            # pwsh는 마지막 native 명령의 종료 코드로 단계를 끝내므로, 기대한 종료 코드 1이 단계의 실패로 남지 않게 지웁니다.
            $global:LASTEXITCODE = 0
            @{ Output = $output; Status = $status }
          }

          # 한 경로에서 실패해도 나머지 경로의 결과를 로그에 남기도록, 실패를 모아 마지막에 알립니다.
          $failures = @()
          $nested = New-Item -ItemType Directory (Join-Path $env:WORKSPACE Nested\Deeper)
          foreach ($cwd in $env:WORKSPACE.ToLowerInvariant(), $env:WORKSPACE.ToUpperInvariant(), $nested.FullName.ToLowerInvariant()) {
            $result = Invoke-BdDesk start $cwd
            if ($result.Status -ne 0 -or $result.Output -cnotcontains "URL: $env:DESK_URL") { $failures += "start from $cwd did not print the workspace URL: $env:DESK_URL" }
          }
          $workspaces = @((Invoke-RestMethod "$env:DESK_SERVER/api/workspaces").data.workspaces)
          $workspaces | ConvertTo-Json
          if ($workspaces.Count -ne 1 -or $workspaces[0].root -cne $env:WORKSPACE) { $failures += "Expected only $env:WORKSPACE to be registered." }

          $result = Invoke-BdDesk restart $env:WORKSPACE.ToUpperInvariant()
          if ($result.Status -ne 0 -or $result.Output -cnotcontains "URL: $env:DESK_URL") { $failures += "restart from $($env:WORKSPACE.ToUpperInvariant()) did not print the workspace URL: $env:DESK_URL" }

          # .beads가 없는 git 저장소에서는 git 최상위에서 멈추고, 그 위에 있는 workspace의 .beads를 찾지 않아야 합니다.
          $repo = New-Item -ItemType Directory (Join-Path $env:WORKSPACE Inner)
          git -C $repo init --quiet
          $result = Invoke-BdDesk start $repo.FullName.ToLowerInvariant()
          if ($result.Status -ne 1) { $failures += "start from a git repository without .beads found a workspace above its top level." }
          if ($failures) { throw ($failures -join "`n") }

      # Windows에서 bd-desk stop은 서버 pid만 종료하므로, 서버가 실행하던 bd가 남지 않는지 확인합니다.
      # 이슈 목록을 계속 요청해 서버 아래에서 bd가 실행되는 동안 stop합니다.
      - name: Stop the server
        run: |
          $serverPid = (Get-Content (Join-Path (node -p "require('os').tmpdir()") beads-desk\server.json) | ConvertFrom-Json).pid
          # Windows는 부모가 종료돼도 하위 process의 ParentProcessId를 바꾸지 않으므로, 종료된 서버 pid로도 남은 하위 process를 찾을 수 있습니다.
          function Get-ServerDescendants {
            $all = @(Get-CimInstance Win32_Process)
            $found = @()
            $parents = @($serverPid)
            while ($parents) {
              $children = @($all | Where-Object { $parents -contains $_.ParentProcessId })
              $found += $children
              $parents = @($children.ProcessId)
            }
            , $found
          }
          $load = Start-ThreadJob -ArgumentList "$env:DESK_SERVER/api/issues?workspace=desk-smoke" {
            param($url)
            while ($true) { try { Invoke-WebRequest $url | Out-Null } catch { Start-Sleep -Milliseconds 100 } }
          }
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do { $before = Get-ServerDescendants } until (@($before | Where-Object Name -eq 'bd.exe').Count -or (Get-Date) -gt $deadline)
            $before | Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize -Wrap
            if (-not @($before | Where-Object Name -eq 'bd.exe').Count) { throw "bd never ran under the server while the issue list was requested." }
            bd-desk stop
            $after = Get-ServerDescendants
          } finally {
            Stop-Job $load
            Remove-Job $load -Force
          }
          if ($after.Count) {
            $after | Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize -Wrap
            throw "Processes started by the server remain after bd-desk stop."
          }
          $responding = $true
          try { Invoke-WebRequest "$env:DESK_SERVER/api/health" -TimeoutSec 5 | Out-Null } catch { $responding = $false }
          if ($responding) { throw "The server still responds after bd-desk stop." }

      # bd-desk는 서버 로그를 OS 임시 디렉터리 아래 beads-desk\server.log에 남깁니다.
      - name: Print the server log
        if: always()
        run: |
          $log = Join-Path (node -p "require('os').tmpdir()") beads-desk\server.log
          if (Test-Path $log) { Get-Content $log }
